name: SITE-004 safe release tests

on:
  pull_request:
    paths:
      - 'server/site004_*.py'
      - 'tests/test_site004_*.py'
      - '.github/workflows/site004-*.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify release stays unprivileged and does not alter forms
        run: python3 -m unittest discover -s tests -p 'test_site004_*.py' -v
